<!DOCTYPE html>
<html>
<head>
<title>Ramadan Countdown - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e8f5e9; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Ramadan Countdown 🕌</h1>
<p>Project 43 - By Ismail</p>
<p>When Is Ramadan 2027?</p>
<button onclick="check()">Check</button>
<h2 id="r"></h2>
</div>
<script>
function check(){
let ramadan = new Date("2027-02-18");
let now = new Date();
let diff = ramadan - now;
let days = Math.floor(diff / (1000*60*60*24));
document.getElementById("r").innerText = days + " Days Left!";
}
check();
</script>
</body>
</html>
