<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e3f2fd; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { width: 70px; height: 70px; font-size: 28px; margin: 3px; background: #1976d2; color: white; border: none; border-radius: 8px; }
</style>
</head>
<body>
<div class="box">
<h1>Tic Tac Toe ❌⭕</h1>
<p>Project 21 - By Ismail</p>
<div>
<button onclick="this.innerText='X'">-</button>
<button onclick="this.innerText='O'">-</button>
<button onclick="this.innerText='X'">-</button>
<br>
<button onclick="this.innerText='O'">-</button>
<button onclick="this.innerText='X'">-</button>
<button onclick="this.innerText='O'">-</button>
<br>
<button onclick="this.innerText='X'">-</button>
<button onclick="this.innerText='O'">-</button>
<button onclick="this.innerText='X'">-</button>
</div>
<p>Click To Play!</p>
</div>
</body>
</html>
