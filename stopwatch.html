<!DOCTYPE html>
<html>
<head>
<title>Stopwatch - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e8eaf6; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 20px; margin: 5px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Stopwatch ⏱️</h1>
<p>Project 15 - By Ismail</p>
<h1 id="time">0</h1>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>
</div>
<script>
let s = 0;
let timer;
function start(){
timer = setInterval(()=>{ s++; document.getElementById("time").innerText = s; }, 1000);
}
function stop(){ clearInterval(timer); }
function reset(){ clearInterval(timer); s = 0; document.getElementById("time").innerText = 0; }
</script>
</body>
</html>
