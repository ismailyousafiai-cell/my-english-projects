<!DOCTYPE html>
<html>
<head>
<title>Birthday Countdown - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #fce4ec; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 25px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Birthday Countdown 🎂</h1>
<p>Project 31 - By Ismail</p>
<p>My Birthday: 13 Nov</p>
<button onclick="check()">How Many Days Left?</button>
<h2 id="r"></h2>
</div>
<script>
function check(){
let bday = new Date("2026-11-13");
let now = new Date();
let diff = bday - now;
let days = Math.floor(diff / (1000*60*60*24));
document.getElementById("r").innerText = days + " Days Left!";
}
check();
</script>
</body>
</html>
