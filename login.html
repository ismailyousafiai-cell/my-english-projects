<!DOCTYPE html>
<html>
<head>
<title>Login - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e3f2fd; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; margin: 5px; font-size: 16px; }
button { padding: 12px 25px; background: #1976d2; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Login</h1>
<p>Project 11 - By Ismail</p>
<input type="text" id="user" placeholder="Enter Username">
<input type="password" id="pass" placeholder="Enter Password">
<br><br>
<button onclick="login()">Login</button>
<h2 id="r"></h2>
</div>
<script>
function login(){
let u = document.getElementById("user").value;
if(u) document.getElementById("r").innerText = "Welcome " + u + "!";
else document.getElementById("r").innerText = "Please Enter Username!";
}
</script>
</body>
</html>
