<!DOCTYPE html>
<html>
<head>
<title>Salary Calculator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e8f5e9; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; font-size: 16px; }
button { padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>Salary Calculator 💷</h1>
<p>Project 22 - By Ismail</p>
<p>Monthly Salary (£):</p>
<input type="number" id="s" placeholder="3250">
<br>
<button onclick="calc()">Calculate</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let s = Number(document.getElementById("s").value);
let yearly = s * 12;
document.getElementById("r").innerText = "Yearly Salary: £" + yearly + " - Monthly: £" + s;
}
</script>
</body>
</html>
