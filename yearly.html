<!DOCTYPE html>
<html>
<head>
<title>Yearly Expense - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #fff8e1; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; font-size: 16px; width: 80%; }
button { padding: 12px 25px; background: #ff8f00; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>Yearly Expense 💷</h1>
<p>Project 45 - By Ismail</p>
<p>Enter Monthly Salary (£):</p>
<input type="number" id="m" placeholder="3250">
<br>
<button onclick="calc()">Show Yearly</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let m = Number(document.getElementById("m").value);
let yearly = m * 12;
let savings = (m - 750 - 740) * 12;
document.getElementById("r").innerHTML = "Yearly Salary: £" + yearly + "<br>Yearly Savings: £" + savings;
}
</script>
</body>
</html>
