<!DOCTYPE html>
<html>
<head>
<title>Calculator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e3f2fd; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; margin: 5px; font-size: 16px; }
button { padding: 12px 25px; background: #1976d2; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>My Calculator</h1>
<p>Project 1 - By Ismail</p>
<input type="number" id="a" placeholder="Enter First Number">
<input type="number" id="b" placeholder="Enter Second Number">
<br><br>
<button onclick="calc()">Calculate</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let a = Number(document.getElementById("a").value);
let b = Number(document.getElementById("b").value);
document.getElementById("r").innerText = "Answer: " + (a + b);
}
</script>
</body>
</html>
