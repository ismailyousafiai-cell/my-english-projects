<!DOCTYPE html>
<html>
<head>
<title>Coin Flip - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #fffde7; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 25px; background: #fbc02d; color: black; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Coin Flip 🪙</h1>
<p>Project 24 - By Ismail</p>
<button onclick="flip()">Flip Coin</button>
<h1 id="r" style="font-size: 50px;">🪙</h1>
</div>
<script>
function flip(){
let n = Math.random() < 0.5 ? "Heads" : "Tails";
document.getElementById("r").innerText = n;
}
</script>
</body>
</html>
