<!DOCTYPE html>
<html>
<head>
<title>Password Generator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #f3e5f5; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 25px; background: #8e24aa; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Password Generator 🔑</h1>
<p>Project 13 - By Ismail</p>
<button onclick="gen()">Generate Password</button>
<h2 id="r"></h2>
</div>
<script>
function gen(){
let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
let pass = "";
for(let i=0;i<8;i++) pass += chars[Math.floor(Math.random()*chars.length)];
document.getElementById("r").innerText = pass;
}
</script>
</body>
</html>
