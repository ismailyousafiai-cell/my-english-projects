<!DOCTYPE html>
<html>
<head>
<title>Tip Calculator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #fff8e1; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; font-size: 16px; }
button { padding: 12px 25px; background: #ff8f00; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>Tip Calculator 💷</h1>
<p>Project 16 - By Ismail</p>
<input type="number" id="bill" placeholder="Enter Bill Amount">
<br><br>
<button onclick="calc()">Calculate Tip</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let bill = Number(document.getElementById("bill").value);
let tip = bill * 0.10;
document.getElementById("r").innerText = "Tip: £" + tip.toFixed(2) + " - Total: £" + (bill + tip).toFixed(2);
}
</script>
</body>
</html>
