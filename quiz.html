<!DOCTYPE html>
<html>
<head>
<title>Quiz - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #f3e5f5; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
button { padding: 12px 20px; margin: 5px; background: #8e24aa; color: white; border: none; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
<h1>Quiz</h1>
<p>Project 8 - By Ismail</p>
<p>What is 2 + 2?</p>
<button onclick="check(4)">4</button>
<button onclick="check(5)">5</button>
<button onclick="check(3)">3</button>
<h2 id="r"></h2>
</div>
<script>
function check(ans){
if(ans === 4) document.getElementById("r").innerText = "Correct! 🎉";
else document.getElementById("r").innerText = "Wrong! Try Again!";
}
</script>
</body>
</html>
