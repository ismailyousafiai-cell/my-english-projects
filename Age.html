<!DOCTYPE html>
<html>
<head>
<title>Age Calculator - Ismail</title>
<style>
body { font-family: Arial; text-align: center; background: #e8eaf6; padding: 30px; }
.box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
input { padding: 10px; width: 80%; font-size: 16px; }
button { padding: 12px 25px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>Age Calculator</h1>
<p>Project 2 - By Ismail</p>
<p>Enter Birth Year:</p>
<input type="number" id="year" placeholder="2009">
<br>
<button onclick="calc()">Calculate</button>
<h2 id="r"></h2>
</div>
<script>
function calc(){
let y = Number(document.getElementById("year").value);
let age = 2026 - y;
document.getElementById("r").innerText = "Your Age: " + age + " Years!";
}
</script>
</body>
</html>
